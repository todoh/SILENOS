<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOZ Gemini - Live Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --surface2: #f5f5f5;
            --text: #000000;
            --text-dim: #888888;
            --border: #e4e4e7;
            --radius: 16px;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-section {
            width: 450px;
            height: 90vh;
            display: flex;
            flex-direction: column;
            padding: 24px;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border: 1px solid var(--border);
        }

        #chat {
            flex: 1;
            background: var(--surface2);
            padding: 16px;
            border-radius: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 16px 0;
        }

        .msg {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 14px;
            font-size: 14px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .msg.user {
            align-self: flex-end;
            background: #000000;
            color: #ffffff;
            border-bottom-right-radius: 2px;
        }

        .msg.gemini {
            align-self: flex-start;
            background: #ffffff;
            color: #000000;
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }

        .msg.system {
            align-self: center;
            background: transparent;
            color: var(--text-dim);
            font-size: 11px;
            text-align: center;
        }

        button.active-mic {
            background: #ef4444 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>

    <aside class="chat-section">
        <!-- Header & Configuración Key -->
        <div class="flex items-center justify-between pb-3 border-b border-slate-200 gap-2">
            <button id="connectBtn" onclick="toggleConnection()" class="bg-slate-900 text-white px-4 py-2 rounded-full text-xs font-semibold hover:bg-slate-800 transition-all">CONECTAR</button>
            <span id="statusText" class="text-xs text-slate-400 font-mono">🔴 DESCONECTADO</span>
        </div>

        <!-- Input API Key sin guardado en LocalStorage -->
        <div class="mt-3 flex flex-col gap-1">
            <label for="apiKey" class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Gemini API Key</label>
            <input type="password" id="apiKey" placeholder="Pega tu API Key aquí..." class="w-full bg-slate-100 p-2.5 rounded-xl text-xs border border-slate-200 outline-none focus:border-slate-400 transition-all">
        </div>

        <!-- Área de Conversación -->
        <div id="chat">
            <div class="msg system">Introduce tu API Key y pulsa CONECTAR para iniciar la voz bidireccional.</div>
        </div>

        <!-- Controles de Audio y Texto -->
        <div class="controls flex gap-2 pt-2 border-t border-slate-200">
            <button id="micBtn" onclick="toggleMic()" disabled class="bg-slate-100 hover:bg-slate-200 text-slate-800 p-3 rounded-full border border-slate-200 transition-all flex items-center justify-center">
                <i data-lucide="mic" class="w-4 h-4"></i>
            </button>
            <input type="text" id="textInput" placeholder="Escribe un mensaje..." onkeypress="handleKeyDown(event)" disabled class="bg-slate-100 border border-slate-200 focus:bg-white rounded-full px-4 text-xs outline-none flex-1">
            <button id="sendBtn" onclick="sendTextMessage()" disabled class="bg-slate-900 text-white p-3 rounded-full hover:bg-slate-800 transition-all flex items-center justify-center">
                <i data-lucide="send" class="w-4 h-4"></i>
            </button>
        </div>
    </aside>

    <script>
        // ─── CONFIGURACIÓN Y ESTADO ───
        const MODEL = 'gemini-3.8-live';
        let ws = null;
        let isConnected = false;

        // Reproducción de Audio (Gemini -> Altavoces)
        let audioContext = null;
        let audioQueue = [];
        let isPlayingAudio = false;
        let nextAudioTime = 0;
        let currentActiveSource = null;
        let voiceFilter = null;
        let voiceCompressor = null;
        let masterGain = null;

        // Captura de Micrófono (Usuario -> Gemini)
        let micStream = null;
        let micCtx = null;
        let micProcessor = null;
        let isMicActive = false;
        let lastInterruptTime = 0;

        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) lucide.createIcons();
        });

        // ─── UTILIDADES BASE64 / PCM ───
        function base64ToFloat32(b64) {
            const binary = atob(b64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            const pcm16 = new Int16Array(bytes.buffer);
            const float32 = new Float32Array(pcm16.length);
            for (let i = 0; i < pcm16.length; i++) float32[i] = pcm16[i] / 32768.0;
            return float32;
        }

        function arrayBufferToBase64(buffer) {
            const bytes = new Uint8Array(buffer);
            let binary = '';
            for (let i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary);
        }

        // ─── INTERFAZ DE USUARIO ───
        function addMessage(role, text, isAudio = false) {
            if (!text.trim() && !isAudio) return;
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            
            let label = role === 'user' ? 'TÚ' : (role === 'gemini' ? 'VOZ' : 'SISTEMA');
            div.innerHTML = `<strong>${label}:</strong><br>${text}${isAudio ? ' 🔊' : ''}`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        // ─── CONEXIÓN WEBSOCKET BIDI ───
        async function toggleConnection() {
            if (isConnected) {
                disconnect();
                return;
            }

            const apiKey = document.getElementById('apiKey').value.trim();
            if (!apiKey) return alert("Pega tu API Key primero.");

            document.getElementById('statusText').innerText = "🟡 CONECTANDO...";
            
            try {
                const wsUrl = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    const setup = {
                        setup: {
                            model: `models/${MODEL}`,
                            generation_config: {
                                response_modalities: ['AUDIO'],
                                speech_config: { voice_config: { prebuilt_voice_config: { voice_name: 'Aoede' } } }
                            },
                            system_instruction: {
                                parts: [{ text: "Tu nombre es VOZ, tu titulo es SILENOS. Eres un asistente y arquitecto de software brillante, observador y conversacional." }]
                            },
                            input_audio_transcription: {},
                            output_audio_transcription: {}
                        }
                    };
                    ws.send(JSON.stringify(setup));
                    
                    isConnected = true;
                    document.getElementById('statusText').innerText = "🟢 CONECTADO";
                    const connBtn = document.getElementById('connectBtn');
                    connBtn.innerText = "DESCONECTAR";
                    connBtn.classList.replace('bg-slate-900', 'bg-red-600');

                    document.getElementById('micBtn').disabled = false;
                    document.getElementById('textInput').disabled = false;
                    document.getElementById('sendBtn').disabled = false;

                    // Configuración del motor de Audio Output
                    audioContext = new AudioContext({ sampleRate: 24000 });
                    
                    voiceFilter = audioContext.createBiquadFilter();
                    voiceFilter.type = "lowpass";
                    voiceFilter.frequency.setValueAtTime(8500, audioContext.currentTime);
                    
                    voiceCompressor = audioContext.createDynamicsCompressor();
                    voiceCompressor.threshold.setValueAtTime(-24, audioContext.currentTime);
                    voiceCompressor.knee.setValueAtTime(30, audioContext.currentTime);
                    voiceCompressor.ratio.setValueAtTime(12, audioContext.currentTime);
                    voiceCompressor.attack.setValueAtTime(0.003, audioContext.currentTime);
                    voiceCompressor.release.setValueAtTime(0.25, audioContext.currentTime);
                    
                    masterGain = audioContext.createGain();
                    masterGain.gain.setValueAtTime(1.1, audioContext.currentTime);

                    voiceFilter.connect(voiceCompressor);
                    voiceCompressor.connect(masterGain);
                    masterGain.connect(audioContext.destination);
                    
                    addMessage('system', 'Sesión de voz activa.');
                };

                ws.onmessage = async (evt) => {
                    let textData = evt.data;
                    if (textData instanceof Blob) textData = await textData.text();
                    const data = JSON.parse(textData);

                    if (data.serverContent && data.serverContent.interrupted) {
                        interruptAudio();
                    }

                    if (data.serverContent && data.serverContent.modelTurn) {
                        let textTurn = "";
                        let hasAudio = false;

                        for (const part of data.serverContent.modelTurn.parts) {
                            if (part.inlineData && part.inlineData.mimeType.startsWith('audio/')) {
                                const pcm = base64ToFloat32(part.inlineData.data);
                                queueAudio(pcm);
                                hasAudio = true;
                            }
                            if (part.text) {
                                textTurn += part.text;
                            }
                        }

                        if (textTurn) addMessage('gemini', textTurn, hasAudio);
                    }
                };

                ws.onerror = (e) => {
                    console.error("Error WebSocket:", e);
                    disconnect();
                };

                ws.onclose = () => {
                    disconnect();
                };

            } catch (err) {
                alert("Error de conexión: " + err.message);
                disconnect();
            }
        }

        function disconnect() {
            if (ws) ws.close();
            ws = null;
            isConnected = false;
            
            stopMic();
            audioQueue = [];
            isPlayingAudio = false;
            
            if (currentActiveSource) {
                try { currentActiveSource.stop(); } catch(e) {}
                currentActiveSource = null;
            }

            if (voiceFilter) {
                try {
                    voiceFilter.disconnect();
                    voiceCompressor.disconnect();
                    masterGain.disconnect();
                } catch(e) {}
            }

            document.getElementById('statusText').innerText = "🔴 DESCONECTADO";
            const connBtn = document.getElementById('connectBtn');
            connBtn.innerText = "CONECTAR";
            connBtn.classList.replace('bg-red-600', 'bg-slate-900');
            
            document.getElementById('micBtn').disabled = true;
            document.getElementById('textInput').disabled = true;
            document.getElementById('sendBtn').disabled = true;
        }

        // ─── MOTOR DE REPRODUCCIÓN (ANTI-POP CONTINUO) ───
        function queueAudio(float32) {
            audioQueue.push(float32);
            if (!isPlayingAudio) {
                if (audioContext) {
                    nextAudioTime = audioContext.currentTime + 0.03;
                }
                playNextChunk();
            }
        }

        function playNextChunk() {
            if (!audioContext || audioQueue.length === 0) {
                isPlayingAudio = false;
                return;
            }
            
            isPlayingAudio = true;
            const data = audioQueue.shift();
            const buf = audioContext.createBuffer(1, data.length, 24000);
            buf.getChannelData(0).set(data);
            
            const src = audioContext.createBufferSource();
            src.buffer = buf;
            
            if (voiceFilter) {
                src.connect(voiceFilter);
            } else {
                src.connect(audioContext.destination);
            }

            if (nextAudioTime < audioContext.currentTime) {
                nextAudioTime = audioContext.currentTime + 0.03;
            }

            src.start(nextAudioTime);
            currentActiveSource = src;
            
            const duration = buf.duration;
            nextAudioTime += duration;
            
            const timeToNext = (nextAudioTime - audioContext.currentTime - 0.03) * 1000;
            setTimeout(playNextChunk, Math.max(0, timeToNext));
        }

        function interruptAudio() {
            audioQueue = [];
            isPlayingAudio = false;
            if (currentActiveSource) {
                try { currentActiveSource.stop(); } catch(e) {}
                currentActiveSource = null;
            }
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ clientContent: { turnComplete: true } }));
            }
        }

        // ─── GESTIÓN DE CAPTURA DE MICRÓFONO ───
        async function toggleMic() {
            if (isMicActive) {
                stopMic();
                return;
            }
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ 
                    audio: { 
                        sampleRate: 16000, 
                        channelCount: 1, 
                        echoCancellation: true, 
                        noiseSuppression: true,
                        autoGainControl: true 
                    } 
                });
                
                micCtx = new AudioContext({ sampleRate: 16000 });
                const src = micCtx.createMediaStreamSource(micStream);
                
                micProcessor = micCtx.createScriptProcessor(2048, 1, 1);
                src.connect(micProcessor);
                micProcessor.connect(micCtx.destination);

                micProcessor.onaudioprocess = (e) => {
                    if (!ws || ws.readyState !== WebSocket.OPEN) return;
                    
                    const input = e.inputBuffer.getChannelData(0);
                    
                    // Cálculo VAD para interrupción rápida
                    let sum = 0;
                    for (let i = 0; i < input.length; i++) sum += input[i] * input[i];
                    let rms = Math.sqrt(sum / input.length);
                    
                    if (rms > 0.015 && (isPlayingAudio || audioQueue.length > 0)) {
                        const now = Date.now();
                        if (now - lastInterruptTime > 400) {
                            interruptAudio();
                            lastInterruptTime = now;
                        }
                    }

                    const pcm16 = new Int16Array(input.length);
                    for (let i = 0; i < input.length; i++) {
                        pcm16[i] = Math.max(-32768, Math.min(32767, input[i] * 32768));
                    }
                    
                    const b64 = arrayBufferToBase64(pcm16.buffer);
                    
                    ws.send(JSON.stringify({
                        realtimeInput: {
                            audio: { data: b64, mimeType: 'audio/pcm;rate=16000' }
                        }
                    }));
                };

                isMicActive = true;
                const btn = document.getElementById('micBtn');
                btn.classList.add('active-mic');

            } catch (e) {
                alert("Error al acceder al micrófono: " + e.message);
            }
        }

        function stopMic() {
            if (micStream) {
                micStream.getTracks().forEach(t => t.stop());
                micStream = null;
            }
            if (micCtx) {
                try { micCtx.close(); } catch(e) {}
            }
            
            if (ws && ws.readyState === WebSocket.OPEN && isMicActive) {
                ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
            }

            isMicActive = false;
            const btn = document.getElementById('micBtn');
            btn.classList.remove('active-mic');
        }

        // ─── ENVÍO DE TEXTO ───
        function sendTextMessage() {
            const input = document.getElementById('textInput');
            const text = input.value.trim();
            if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
            
            interruptAudio();

            ws.send(JSON.stringify({
                clientContent: {
                    turns: [{ role: "user", parts: [{ text: text }] }],
                    turnComplete: true
                }
            }));
            
            addMessage('user', text);
            input.value = '';
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter') sendTextMessage();
        }
    </script>
</body>
</html>
