ay" class="calc-display" aria-label="Expresión" placeholder="0" autocomplete="off" spellcheck="false"><div class="calc-result" id="calcResult" aria-live="polite"></div><div class="calc-keys" id="calcKeys"></div></section><section class="app-window" id="appWindow" aria-labelledby="windowTitle" hidden>

<script type="module">
import { pipeline, env, TextStreamer } from './lib/transformers.min.js?v=2';
env.allowRemoteModels=false; env.allowLocalModels=true; env.localModelPath='./';
env.backends.onnx.wasm.wasmPaths = undefined;
const wasmParts = await Promise.all(Array.from({length:3}, (_, i) => fetch('./lib/runtime.wasm.part' + (i + 1)).then(r => { if (!r.ok) throw new Error('No se pudo descargar una parte del motor WebAssembly'); return r.arrayBuffer(); })));
env.backends.onnx.wasm.wasmBinary = await new Blob(wasmParts).arrayBuffer();
env.backends.onnx.wasm.numThreads=1;
const $=id=>document.getElementById(id);
const requiredModelFiles = ['model_q4.onnx', 'model_q4.onnx_data'];
const readModelMetadata = fetch.bind(window);
async function loadModelFiles() {
  const status = document.getElementById('status');
  let database;
  try {
    database = await new Promise((resolve, reject) => {
      const request = indexedDB.open('lfm-portatil-q4', 1);
      request.onupgradeneeded = () => request.result.createObjectStore('model');
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  } catch (error) {
    console.warn('El navegador no permite guardar el modelo.', error);
  }
  function modelFetch(files) {
    return async resource => {
      const url = new URL(resource instanceof Request ? resource.url : resource, 'https://lfm-portatil.invalid/');
      if (url.origin !== 'https://lfm-portatil.invalid') return new Response(null, { status: 404 });
      const path = decodeURIComponent(url.pathname.slice(1));
      if (!path.startsWith('modelo/onnx/')) return readModelMetadata(resource);
    const file = files.get(path.slice('modelo/onnx/'.length));
      return file
        ? new Response(file.stream(), { headers: { 'Content-Length': String(file.size), 'Content-Type': file.type || 'application/octet-stream' } })
        : new Response(null, { status: 404 });
    };
  }
  if (database) {
    try {
      const saved = await new Promise((resolve, reject) => {
        const request = database.transaction('model').objectStore('model').get('q4');
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
      if (saved && requiredModelFiles.every(path => saved.get(path)?.size)) {
        database.close();
        return modelFetch(saved);
      }
    } catch (error) {
      console.warn('No se pudo leer el modelo guardado.', error);
    }
  }
  const modelSource = 'https://huggingface.co/LiquidAI/LFM2.5-230M-ONNX/resolve/main/onnx/';
  const files = new Map();
  try {
    for (const name of requiredModelFiles) {
      const response = await fetch(modelSource + name, { credentials: 'omit' }).catch(() => {
        throw new Error('No se pudo conectar con Hugging Face para descargar ' + name + '. Comprueba la conexión y recarga la página.');
      });
      if (!response.ok) throw new Error('Hugging Face devolvió HTTP ' + response.status + ' al descargar ' + name + '.');
      const file = await response.blob();
      if (!file.size) throw new Error('Hugging Face devolvió un archivo vacío: ' + name + '.');
      files.set(name, file);
    }
    if (database) {
      try {
        await new Promise((resolve, reject) => {
          const transaction = database.transaction('model', 'readwrite');
          transaction.oncomplete = resolve;
          transaction.onabort = () => reject(transaction.error);
          transaction.objectStore('model').put(files, 'q4');
        });
        return modelFetch(files);
      } catch (error) {
        console.warn('No se pudo guardar el modelo.', error);
      }
    }
    console.warn('El navegador no pudo guardar el modelo; se volverá a descargar al iniciar.');
    return modelFetch(files);
  } finally {
    database?.close();
  }
}
const storageKey='lfm-local-conversations-v1', settingsKey='lfm-local-settings-v1';
const defaults={maxTokens:2048,temperature:0.1,topP:1,topK:50,repetition:1.05,system:'Responde en español de forma clara y natural.'};
function load(key, fallback){try{return JSON.parse(localStorage.getItem(key)) ?? fallback}catch{return fallback}}
function storeSetting(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); }
  catch (error) { console.warn('No se pudo guardar la configuración.', error); }
}
async function openHistory() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('lfm-local-history', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('history');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
let historyDatabase;
let cachedHistory;
try {
  historyDatabase = await openHistory();

function enableBoxSelection(pane, list, index) {

  if (start.button !== 0 || start.pointerType !== 'mouse' || start.target.closest('.file-item, .pane-tools')) return;

  const initial = (start.ctrlKey || start.metaKey) && selectionPane === index
   ? new Map(selectedEntries) : new Map();
  const original = new Map(selectedEntries);
  const originalPane = selectionPane;
  const box = document.createElement('div');

  const clip = (value, min, max) => Math.max(min, Math.min(value, max));

  function draw(event) {
   if (event.pointerId !== start.pointerId) return;
   if (!drawing && Math.hypot(event.clientX-start.clientX, event.clientY-start.clientY) < 5) return;
   if (!drawing) {
    drawing = true;
    pane.append(box);
    const previous = $('explorerPanes').children[originalPane];
    if (previous && previous !== pane) {
     previous.querySelectorAll('.file-item.selected').forEach(tile => tile.classList.remove('selected'));
    }
   }
   const bounds = pane.getBoundingClientRect();
   const x = clip(event.clientX, bounds.left, bounds.right);
   const y = clip(event.clientY, bounds.top, bounds.bottom);
   const left = Math.min(start.clientX, x), right = Math.max(start.clientX, x);
   const top = Math.min(start.clientY, y), bottom = Math.max(start.clientY, y);
   Object.assign(box.style, {left:left+'px', top:top+'px', width:right-left+'px', height:bottom-top+'px'});

   selectedEntries = new Map(initial);
   selectionPane = index;
   for (const tile of list.querySelectorAll('.file-item')) {
    const rect = tile.getBoundingClientRect();
    const entry = tile.explorerEntry;
    const key = entryKey(entry);
    if (rect.left < right && rect.right > left && rect.top < bottom && rect.bottom > top) {
     selectedEntries.set(key, entry);
    }
    tile.classList.toggle('selected', selectedEntries.has(key));
   }
  }

  function finish(event) {
   if (event.pointerId !== start.pointerId) return;
   pane.removeEventListener('pointermove', draw);
   pane.removeEventListener('pointerup', finish);
   pane.removeEventListener('lostpointercapture', finish);

  }

  pane.addEventListener('pointermove', draw);
  pane.addEventListener('pointerup', finish);
  pane.addEventListener('lostpointercapture', finish);

function evaluateCalculation(source){

 function expression(){let n=term();while(text[pos]==='+'||text[pos]==='-'){const op=text[pos++],v=term();n=op==='+'?n+v:n-v}return n}
 function term(){let n=unary();while(text[pos]==='*'||text[pos]==='/'){const op=text[pos++],v=unary();n=op==='*'?n*v:n/v}return n}
 function unary(){if(text[pos]==='+'){pos++;return unary()}if(text[pos]==='-'){pos++;return -unary()}return power()}
 function power(){let n=primary();if(text[pos]==='^'){pos++;n=Math.pow(n,unary())}return n}
 function primary(){if(text[pos]==='('){pos++;const n=expression();if(text[pos++]!==')')throw Error('Falta cerrar paréntesis');return n}const rest=text.slice(pos);const number=rest.match(/^(?:\d+\.?\d*|\.\d+)(?:[Ee][+-]?\d+)?/);if(number){pos+=number[0].length;return Number(number[0])}const word=rest.match(/^[a-z]+/i);if(!word)throw Error('Expresión incompleta');pos+=word[0].length;const name=word[0].toLowerCase();if(name==='pi')return Math.PI;if(name==='e')return Math.E;if(text[pos++]!=='(')throw Error('Falta abrir paréntesis');const n=expression();if(text[pos++]!==')')throw Error('Falta cerrar paréntesis');const angle=calcDegrees?n*Math.PI/180:n;const funcs={sin:()=>Math.sin(angle),cos:()=>Math.cos(angle),tan:()=>Math.tan(angle),sqrt:()=>Math.sqrt(n),ln:()=>Math.log(n),log:()=>Math.log10(n)};if(!funcs[name])throw Error('Función desconocida');return funcs[name]()}
 if(!text)throw Error('Escribe una operación');const result=expression();if(pos!==text.length)throw Error('Expresión no válida');if(!Number.isFinite(result))throw Error('Resultado no definido');return Number(result.toPrecision(12));
}
function calcAction(action){const input=$('calcDisplay'),result=$('calcResult');if(action==='mode'){calcDegrees=!calcDegrees;$('calcMode').textContent=calcDegrees?'DEG':'RAD';return}if(action==='clear'){input.value='';result.textContent='';input.focus();return}if(action==='equals'){try{const value=evaluateCalculation(input.value);result.textContent='= '+value;input.value=String(value)}catch(error){result.textContent=error.message}return}if(action==='back'){const start=input.selectionStart,end=input.selectionEnd;if(start===end&&start>0)input.setRangeText('',start-1,end,'end');else input.setRangeText('',start,end,'end')}else if(action==='inverse'){input.value='1/('+input.value+')'}else if(action==='negate'){input.value='-('+input.value+')'}else input.setRangeText(action,input.selectionStart,input.selectionEnd,'end');result.textContent='';input.focus()}
$('calcDisplay').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();calcAction('equals')}else if(event.key==='Escape'){calcAction('clear')}});

function addMessage(content,role,speed){const wrapper=document.createElement('div');wrapper.className='message '+role;const text=document.createElement('div');text.textContent=content;wrapper.append(text);if(speed){const stats=document.createElement('div');stats.className='stats';stats.textContent=speed;wrapper.append(stats)}$('chat').append(wrapper);$('chat').scrollTop=$('chat').scrollHeight;return text}

let deletePopover;
function closeDeleteConfirmation(restoreFocus=false){
 if(!deletePopover)return;
 const trigger=deletePopover.trigger;
 deletePopover.element.remove();deletePopover=undefined;
 if(restoreFocus && trigger.isConnected)trigger.focus();
}
function showDeleteConfirmation(id,trigger){
 closeDeleteConfirmation();
 const box=document.createElement('div');box.className='delete-popover';box.setAttribute('role','dialog');box.setAttribute('aria-label','Confirmar eliminación');
 const question=document.createElement('p');question.textContent='¿Eliminar esta conversación?';
 const actions=document.createElement('div');actions.className='delete-popover-actions';
 const cancel=document.createElement('button');cancel.type='button';cancel.className='delete-cancel';cancel.textContent='Cancelar';
 const confirmButton=document.createElement('button');confirmButton.type='button';confirmButton.className='delete-confirm';confirmButton.textContent='Eliminar';
 cancel.onclick=()=>closeDeleteConfirmation(true);
 confirmButton.onclick=()=>{closeDeleteConfirmation();deleteConversation(id)};
 actions.append(cancel,confirmButton);box.append(question,actions);document.body.append(box);
 const rect=trigger.getBoundingClientRect(), width=box.offsetWidth, height=box.offsetHeight;
 const left=rect.right+8+width<=innerWidth-8?rect.right+8:Math.max(8,rect.left-width-8);
 box.style.left=Math.min(left,innerWidth-width-8)+'px';box.style.top=Math.max(8,Math.min(rect.top,innerHeight-height-8))+'px';
 deletePopover={element:box,trigger};cancel.focus();
}
document.addEventListener('pointerdown',event=>{if(deletePopover && !deletePopover.element.contains(event.target) && !deletePopover.trigger.contains(event.target))closeDeleteConfirmation()});
document.addEventListener('keydown',event=>{if(event.key==='Escape' && deletePopover){event.preventDefault();closeDeleteConfirmation(true)}});
window.addEventListener('resize',()=>closeDeleteConfirmation());
document.addEventListener('scroll',()=>closeDeleteConfirmation(),true);
function deleteConversation(id){conversations=conversations.filter(item=>item.id!==id);openChats=openChats.filter(chatId=>chatId!==id);if(currentId===id)currentId=openChats[openChats.length-1]||conversations[0]?.id;if(!openChats.length && activeView==='chat')activeView='desktop';save();render()}
try{
 if(!navigator.gpu)throw new Error('WebGPU no está disponible en este navegador.');
 env.fetch = await loadModelFiles();
 generator=await pipeline('text-generation','modelo',{device:'webgpu',dtype:'q4'});
 $('status').textContent='';$('prompt').disabled=false;$('send').disabled=false;
}catch(error){$('status').textContent='No se pudo cargar el modelo: '+error.message;console.error(error)}
$('prompt').addEventListener('keydown', event=>{
 if(event.key==='Enter' && !event.shiftKey && !event.isComposing){
  event.preventDefault();
  $('form').requestSubmit();
 }
});
$('form').addEventListener('submit',async event=>{
 event.preventDefault();const text=$('prompt').value.trim();if(!text||!generator||busy)return;
 for(const key of Object.keys(defaults)) $(key).dispatchEvent(new Event('change'));
 if ($('settings').querySelector(':invalid')) { showView('settings'); $('settings').querySelector(':invalid').reportValidity(); return; }
 const item=current();busy=true;$('prompt').value='';$('prompt').disabled=true;$('send').disabled=true;
 item.messages.push({role:'user',content:text});if(item.title==='Nueva conversación')item.title=text.slice(0,45);save();render();
 const answer=addMessage('','assistant');let tokenCount=0;const started=performance.now();
 try{
  const streamer=new TextStreamer(generator.tokenizer,{skip_prompt:true,skip_special_tokens:true,callback_function:part=>{answer.textContent+=part;$('chat').scrollTop=$('chat').scrollHeight},token_callback_function:tokens=>{tokenCount+=tokens.length}});
  const messages=[...(settings.system.trim()?[{role:'system',content:settings.system.trim()}]:[]),...item.messages.map(({role,content})=>({role,content}))];
  const result=await generator(messages,{max_new_tokens:settings.maxTokens,do_sample:settings.temperature>0,temperature:settings.temperature || 1,top_p:settings.topP,top_k:settings.topK,repetition_penalty:settings.repetition,return_full_text:false,streamer});
  const output=result[0].generated_text;const content=extractReply(output) || answer.textContent;
  const seconds=(performance.now()-started)/1000;const speed=`${tokenCount} tokens · ${(tokenCount/seconds).toFixed(1)} tokens/s`;
  item.messages.push({role:'assistant',content,speed});save();
 }catch(error){$('status').textContent='Error al generar: '+error.message;console.error(error)}
 finally{busy=false;$('prompt').disabled=false;$('send').disabled=false;render();$('prompt').focus()}
});
</script></body></html>
